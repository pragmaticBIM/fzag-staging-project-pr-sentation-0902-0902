definition:
  de: Ein Fundament ist ein flächiges oder blockförmiges Gründungselement, das die Lasten eines Bauwerks aufnimmt und gleichmäßig an den Baugrund oder an Pfähle weiterleitet. Fundamente können als Einzel‑,
    Streifen‑ oder Pfahlkopfplatten ausgebildet sein und gehören zur permanenten Tragstruktur eines Bauwerks.
  fr: ''
  it: ''
  en: ''
