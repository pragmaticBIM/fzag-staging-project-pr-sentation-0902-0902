description:
  de: 'Der Endzustand des Bauwerks bzw. des Projektperimeters ist als digitales Terrainmodell (DTM) zu projektieren und zu liefern. Das Terrainmodell muss sämtliche für den Endzustand relevanten Geländeoberflächen,
    Böschungen, Randabschlüsse, befestigten Flächen sowie Höheninformationen enthalten.

    Die Abgabe hat in folgenden Formaten zu erfolgen:

    - 3D-DTM als digitales Geländemodell mit vollständiger Geländetriangulation (TIN)

    - DXF/DWG zur Weiterverarbeitung in CAD-Systemen

    - IFC als koordinierter, georeferenzierter Datenaustausch für BIM- und GIS-Anwendungen'
