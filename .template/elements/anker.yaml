name:
  de: Anker
  fr: ''
  it: ''
  en: ''
needed_in_domain:
- fzag:domain/bauhindernisse
definition:
  de: Ein Anker ist ein zugbeanspruchtes, in den Boden oder Fels eingebrachtes Tragglied, das Kräfte aus Stützbauwerken (z. B. Spundwänden, Pfahlwänden oder Mauern) in tragfähige Bodenschichten ableitet.
    Daueranker bestehen aus einer freien Länge und einer Verpresslänge und verbleiben nach Abschluss der Bauarbeiten dauerhaft im Baugrund.
  fr: ''
  it: ''
  en: ''
entity_ifc2x3: null
entity_ifc4: IfcTendon
entity_ifc4_3: IfcTendon
