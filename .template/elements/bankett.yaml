id: fzag:element/bankett
sort_order: 42
status: active
name:
  de: Bankett
  fr: ''
  it: ''
  en: ''
needed_in_domain:
- fzag:domain/oberbau
definition:
  de: "Ein Bankett ist der seitliche Streifen neben einer befestigten Verkehrsfläche (Piste, Rollweg, Serviceweg oder Strasse). Er gehört nicht zur eigentlichen Fahr- bzw. Bewegungsfläche, erfüllt aber\
    \ wichtige technische Funktionen:\n- Entwässerung der Oberfläche\n- Seitliche Stabilisierung des Oberbaus\n- Schutz der Belagskante vor Ausbrüchen\n- Aufnahme von Signalisationen, Befeuerungen oder\
    \ Markierungselementen\n - Sicherheitsbereich für Fahrzeuge bei unbeabsichtigtem Verlassen der befestigten Fläche"
  fr: ''
  it: ''
  en: ''
entity_ifc2x3: null
entity_ifc4: IfcBuildingElementProxy
entity_ifc4_3: IfcEarthworksFill
picture_link: null
model_link: null
applicability: entity_ifc4=IfcBuildingElementProxy AND Subtyp=Bankett
