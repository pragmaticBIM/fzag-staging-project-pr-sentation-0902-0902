description:
  de: 'Die Fachmodelle dienen als verbindliche Grundlage für die Absteckung sämtlicher projektierter Anlagen während der Ausführung. Die für die Absteckung erforderlichen Geometrien, Höhen und Lageinformationen
    werden direkt aus den freigegebenen As-Planned-Modellen abgeleitet.

    Die Bereitstellung der Absteckdaten erfolgt in folgenden Formaten:

    - 3D-DTM als digitales Geländemodell mit vollständiger Triangulation (TIN)

    - DXF zur Verwendung in Vermessungs- und CAD-Systemen


    Entwässerung: Wasserlauf/Unterkante Innen als Linie

    Elektro: Unterkante Rohr + Unterkante Rohrumhüllung als Linie

    Trinkwasser: Unterkante Rohr + Unterkante Rohrumhüllung als Linie

    Achtung: Bogen nicht vergessen !'
