description:
  de: 'Das digitale Terrainmodell der ausgeführten Oberfläche dient der Qualitätssicherung, der geometrischen Kontrolle der Ausführung sowie der Dokumentation des realisierten Endzustandes. Das Modell umfasst
    sämtliche relevanten Oberflächengeometrien wie befestigte Flächen, Bankette, Böschungen, Randabschlüsse sowie die zugehörigen Höheninformationen.

    Das DTM ermöglicht den Vergleich zwischen dem projektierten Zustand (As-Planned) und dem ausgeführten Zustand (As-Built) hinsichtlich:

    Das Modell der ausgeführten Oberfläche ist in folgenden Formaten bereitzustellen:

    - 3D-DTM (TIN) als digitales Geländemodell

    - DXF zur Weiterverarbeitung in CAD- und Vermessungssystemen

    - IFC als georeferenziertes Austauschmodell für BIM-, GIS- und Betriebssysteme'
