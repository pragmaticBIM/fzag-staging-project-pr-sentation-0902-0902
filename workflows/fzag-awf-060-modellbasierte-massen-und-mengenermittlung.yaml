description:
  de: "Die digitalen Fachmodelle dienen als Grundlage für die transparente, nachvollziehbare und effiziente Ermittlung von Massen und Mengen während Planung, Ausschreibung, Vergabe und Ausführung.\nDie\
    \ Mengen sollen direkt aus den Fachmodellen abgeleitet und für Auswertungen zur Verfügung gestellt werden.\nDie relevanten Objekte sind mit den erforderlichen Attributen und Klassifizierungen zu versehen,\
    \ sodass Längen, Flächen, Volumen, Stückzahlen und weitere Mengeneinheiten automatisiert ausgewertet werden können.\nFür die Durchführung der Mengenermittlung ist ein BIM-Viewer mit integrierter Datentabelle\
    \ und Filterfunktion bereitzustellen. \nDie Mengenermittlungen müssen jederzeit anhand der Modellgeometrie und der zugehörigen Objektattribute nachvollziehbar sein."
